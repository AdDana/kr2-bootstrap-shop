<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Каталог товаров учебного интернет-магазина.">
  <title>Каталог товаров — Учебный интернет-магазин</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="Учебный интернет-магазин">
  <meta property="og:description" content="Учебный frontend-проект интернет-магазина.">
  <meta property="og:image" content="https://username.github.io/kr1-html-css-shop/images/preview.jpg">
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/custom.css">
  <script src="js/main.js" defer></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold text-dark" href="index.html">МАГАЗИН ФИГУРОК</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
        <li class="nav-item"><a class="nav-link active" href="catalog.html">Каталог</a></li>
        <li class="nav-item"><a class="nav-link" href="contacts.html">Контакты</a></li>
        <li class="nav-item"><a class="nav-link" href="product.html">Товар (пример)</a></li>
        <li class="nav-item"><a class="nav-link" href="order.html">Оформить заказ</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow border-0 rounded-4">
        <div class="card-body p-5">
          <h2 class="text-center fw-bold mb-4">Оформление заявки</h2>

          <form>
            <div class="mb-3">
              <label for="name" class="form-label">Имя</label>
              <input type="text" class="form-control" id="name" required>
            </div>

            <div class="mb-3">
              <label for="phone" class="form-label">Телефон</label>
              <div class="input-group">
                <span class="input-group-text">+7</span>
                <input type="tel" class="form-control" id="phone" placeholder="(900) 000-00-00" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="product" class="form-label">Выберите фигурку</label>
              <select class="form-select" id="product">
                <option selected>Kuricha Maid</option>
                <option>KAngel</option>
                <option>Saya</option>
              </select>
            </div>

            <div class="mb-4">
              <label for="comment" class="form-label">Комментарий</label>
              <textarea class="form-control" id="comment" rows="3"></textarea>
            </div>

            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="agree" required>
              <label class="form-check-label" for="agree">
                Согласен на обработку персональных данных
              </label>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-lg">Отправить</button>
          </form>

        </div>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
    <div class="site-footer__inner">
        <p>&copy; 2026 Учебный проект. Все права защищены.</p>
        <p>Дисциплина: Фронтенд и бэкенд разработка</p>
    </div>
</footer>

<script>
    document.querySelector('form').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Заявка успешно отправлена! Мы свяжемся с вами.');
        this.reset();
    });
</script>

</body>
</html>
